# Build and lint on every push and pull request (no publishing).
#
# lint:          spec JSON + generated outputs in sync, shellcheck + smoke tests for the
#                Linux installer (tests/linux/smoke_test.sh).
# build-windows: configure + build x64 and Win32 installers, run MedicatTests and the VHD smoke
#                test. The exes are attached to the run as artifacts, and a push to main also
#                refreshes the rolling `latest` release that the README links to.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medicat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Spec + Linux installer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate spec and generated outputs
        run: |
          python -m json.tool spec/medicat.json > /dev/null
          python -m json.tool spec/extras.json > /dev/null
          python tools/gen_spec.py --check

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck p7zip-full aria2

      - name: Lint Linux installer
        run: |
          bash -n linux/Medicat_Installer.sh
          shellcheck -S warning linux/Medicat_Installer.sh
          shellcheck -S warning tests/linux/smoke_test.sh tools/sync_upstream.sh

      - name: Smoke-test Linux installer
        env:
          MEDICAT_TEST_NETWORK: "1"
        run: bash tests/linux/smoke_test.sh

  build-windows:
    name: Build Windows installers
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write  # the latest-release step below; read is enough for everything else
    env:
      MEDICAT_PIN_BUILD: "1.0.${{ github.run_number }}"
      MEDICAT_BUILD_NUMBER_BUMPED: "1"
      GH_TOKEN: ${{ github.token }}  # lets tools/fetch_ventoy_versions.py use the authenticated API rate limit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: python -m pip install --upgrade pip "pillow==12.3.0"

      - name: Generate i18n and spec
        run: |
          python tools/i18n_codegen.py
          python tools/gen_spec.py --check

      - name: Pin version
        run: python tools/bump_build_number.py build_number.txt generated/build_version.cpp --major 1 --minor 0 --set ${{ env.MEDICAT_PIN_BUILD }}

      - name: Configure CMake
        run: cmake -S cmake/unified -B build -G "Visual Studio 17 2022"

      - name: Build Release (x64 + Win32)
        run: cmake --build build --config Release --target MedicatInstallerAll

      - name: Configure tests
        run: cmake -S . -B build-tests -G "Visual Studio 17 2022" -A x64 -DMEDICAT_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build-tests --config Release --target MedicatTests

      - name: Run tests
        run: build-tests\Release\MedicatTests.exe

      - name: Runtime smoke test (CLI + extras on a VHD)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\smoke_cli.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: MedicatInstaller-ci-${{ github.sha }}
          path: |
            build/Release/MedicatInstaller.exe
            build/Release/MedicatInstaller-x86.exe
          if-no-files-found: error

      # Rolling download without a GitHub login: one release named latest, its tag moved to HEAD and
      # the assets replaced in place. Not a versioned release.
      - name: Refresh the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Rolling build of \`main\` at ${GITHUB_SHA} (installer version 1.0.${GITHUB_RUN_NUMBER}). CI refreshes it on every push; it is not a versioned release.

          - \`MedicatInstaller.exe\`: Windows x64. \`MedicatInstaller-x86.exe\`: Windows 32-bit.
          - Linux: the one-liner in the README fetches \`Medicat_Installer.sh\` from \`main\`.
          - The exe embeds 7-Zip and aria2; their licenses: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/THIRD_PARTY_NOTICES.md"
          # Move the tag in place: deleting it would turn the release into a draft and break the download URLs.
          old=$(git ls-remote origin refs/tags/latest | cut -f1)
          if [ -n "$old" ]; then
            git push --force-with-lease="refs/tags/latest:${old}" origin "HEAD:refs/tags/latest"
          else
            git push origin "HEAD:refs/tags/latest"
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --draft=false --title "Latest build" --notes "$notes"
          else
            gh release create latest --title "Latest build" --notes "$notes"
          fi
          gh release upload latest build/Release/MedicatInstaller.exe build/Release/MedicatInstaller-x86.exe --clobber
          # Corresponding source of the embedded 7-Zip and aria2 (LGPL/GPL): uploaded once per version,
          # superseded archives removed. Keep in step with THIRD_PARTY_NOTICES.md when bumping either.
          sources=(
            "41e2a7c0e9f838351c625e01f0f581a2188bb3dda10c8e0b4a852da26546ffe2 https://www.7-zip.org/a/7z2603-src.7z"
            "60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz"
          )
          have=$(gh release view latest --json assets --jq '.assets[].name')
          wanted=""
          for entry in "${sources[@]}"; do
            sha=${entry%% *}; url=${entry#* }; name=${url##*/}; wanted="$wanted $name"
            if ! grep -qx "$name" <<<"$have"; then
              curl -fsSLO "$url"
              echo "$sha  $name" | sha256sum -c -
              gh release upload latest "$name"
            fi
          done
          for name in $(grep -E '^(7z[0-9]+-src\.7z|aria2-.*\.tar\.xz)$' <<<"$have"); do
            case " $wanted " in *" $name "*) ;; *) gh release delete-asset latest "$name" --yes ;; esac
          done
